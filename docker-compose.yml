services:
  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-esgrima_seac}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      # Activa debug solo en local (pon WP_DEBUG=0 en Coolify)
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      # Claves/sales fijas: sin ellas WordPress las regenera en cada despliegue y cierra todas las sesiones.
      WORDPRESS_AUTH_KEY: ${SERVICE_PASSWORD_64_AUTHKEY}
      WORDPRESS_SECURE_AUTH_KEY: ${SERVICE_PASSWORD_64_SECUREAUTHKEY}
      WORDPRESS_LOGGED_IN_KEY: ${SERVICE_PASSWORD_64_LOGGEDINKEY}
      WORDPRESS_NONCE_KEY: ${SERVICE_PASSWORD_64_NONCEKEY}
      WORDPRESS_AUTH_SALT: ${SERVICE_PASSWORD_64_AUTHSALT}
      WORDPRESS_SECURE_AUTH_SALT: ${SERVICE_PASSWORD_64_SECUREAUTHSALT}
      WORDPRESS_LOGGED_IN_SALT: ${SERVICE_PASSWORD_64_LOGGEDINSALT}
      WORDPRESS_NONCE_SALT: ${SERVICE_PASSWORD_64_NONCESALT}
    volumes:
      # Tema propio versionado en el repo
      - ./wp-content/themes/seac-theme:/var/www/html/wp-content/themes/seac-theme
      # Carpeta de plugins (ACF y otros) versionada
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      # Uploads persistentes (no se versiona en git, va en volumen)
      - wp_uploads:/var/www/html/wp-content/uploads
      # Semilla de migracion inicial (uploads de local), solo lectura.
      # Se copia al volumen persistente via post-deployment command y luego se puede quitar.
      - ./wp-content/uploads-seed:/seed-uploads:ro
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-esgrima_seac}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - db

volumes:
  db_data:
  wp_uploads:
